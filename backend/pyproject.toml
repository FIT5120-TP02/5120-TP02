[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern is `param: X = Depends(...)` in a
# function signature - that's the intended idiom, not the "mutable default
# argument" bug B008 exists to catch. Tell ruff these calls are safe there.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.black]
line-length = 100
target-version = ["py311"]
